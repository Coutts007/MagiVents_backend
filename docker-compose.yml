version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=magivents_db
      - POSTGRES_USER=magivents_user
      - POSTGRES_PASSWORD=magivents_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magivents_user -d magivents_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_gatherings && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - POSTGRES_DB=magivents_db
      - POSTGRES_USER=magivents_user
      - POSTGRES_PASSWORD=magivents_password
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/1

volumes:
  postgres_data: