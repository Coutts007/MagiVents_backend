version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: magivents_db
    restart: always
    environment:
      POSTGRES_DB: magivents_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d magivents_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: magivents_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: 
      context: ./backend
    container_name: magivents_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app  # Maps local code to container for live-reloading
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=magivents_db
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy # Ensures Django waits for DB to be fully ready
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data: